<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 730" width="960" height="730" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
<title>Diagrama de casos de uso - Control de Acceso RFID</title>
<style>
  .bg { fill: #ffffff; }
  .sys { fill: #f7f8fa; stroke: #9aa3b4; stroke-width: 1.5; }
  .sys-t { fill: #1c2230; font-size: 14px; font-weight: 700; }
  .ok { fill: #fdf3e2; stroke: #d97706; stroke-width: 1.6; }
  .todo { fill: #ffffff; stroke: #9aa3b4; stroke-width: 1.4; stroke-dasharray: 6 4; }
  .id { fill: #9a4f00; font-size: 11px; font-weight: 800; }
  .id-todo { fill: #7b8496; font-size: 11px; font-weight: 800; }
  .nm { fill: #1c2230; font-size: 13px; }
  .nm-todo { fill: #5b6475; font-size: 13px; }
  .act { stroke: #1c2230; stroke-width: 2; fill: none; }
  .act-t { fill: #1c2230; font-size: 13px; font-weight: 700; }
  .lnk { stroke: #5b6475; stroke-width: 1.3; }
  .lnk-todo { stroke: #9aa3b4; stroke-width: 1.2; stroke-dasharray: 4 4; }
  .dep { stroke: #5b6475; stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; }
  .dep-t { fill: #5b6475; font-size: 11.5px; font-style: italic; }
  .box { fill: #e8eefc; stroke: #3d5aa8; stroke-width: 1.5; }
  .muted { fill: #5b6475; font-size: 12px; }
  CU-media (prefers-color-scheme: dark) {
    .bg { fill: #1a1e26; }
    .sys { fill: #12151b; stroke: #4a5264; }
    .sys-t, .nm, .act-t { fill: #e7eaf0; }
    .ok { fill: #33260f; stroke: #f59e0b; }
    .todo { fill: #1a1e26; stroke: #5b6475; }
    .id { fill: #fbbf57; }
    .id-todo, .nm-todo, .muted, .dep-t { fill: #9aa3b4; }
    .act { stroke: #e7eaf0; }
    .lnk, .dep { stroke: #9aa3b4; }
    .lnk-todo { stroke: #5b6475; }
    .box { fill: #182340; stroke: #8fb0ff; }
  }
</style>
